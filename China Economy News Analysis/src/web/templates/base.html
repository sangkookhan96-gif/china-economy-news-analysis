<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#87CEEB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CNI">
    <!-- SEO -->
    <meta name="description" content="매일 3회 업데이트 · 20여개 중국 언론 AI 자동선정 중국경제 전문 뉴스 해설 플랫폼">
    <meta name="keywords" content="중국경제, 중국뉴스, 경제해설, AI뉴스선정">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://chinanewsinsight.com{{ request.path }}">
    <!-- OpenGraph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="China News Insight">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="{% block og_title %}{{ site_title }}{% endblock %}">
    <meta property="og:description" content="매일 3회 업데이트 · 중국경제 전문 뉴스 해설">
    <meta property="og:url" content="https://chinanewsinsight.com{{ request.path }}">
    <meta property="og:image" content="https://chinanewsinsight.com/static/og-banner.png?v=1">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>{% block title %}{{ site_title }}{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>body { animation: fadein .4s ease; } @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }</style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">
                <a href="{{ url_for('index') }}">{{ site_title }}</a>
            </h1>
            <p class="site-date">{{ today.strftime('%Y년 %m월 %d일') }}</p>
            <nav class="site-nav">
                <a href="{{ url_for('index') }}" class="nav-link{% if request.endpoint == 'index' %} active{% endif %}">오늘의 뉴스</a>
                <a href="{{ url_for('archive') }}" class="nav-link{% if request.endpoint == 'archive' %} active{% endif %}">아카이브</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ current_year }} {{ site_title }}</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .catch(function() {});
      }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
